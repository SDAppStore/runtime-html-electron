name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build for Windows (x64)'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Build for macOS (ARM64/Intel)'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Build for Linux (AppImage)'
        required: true
        type: boolean
        default: true

jobs:
  build-windows:
    if: inputs.build_windows == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --no-bin-links
      - run: node ./node_modules/electron-builder/out/cli/cli.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-win
          path: dist/*

  build-macos:
    if: inputs.build_macos == true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --no-bin-links
      - run: node ./node_modules/electron-builder/out/cli/cli.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-mac
          path: dist/*

  build-linux:
    if: inputs.build_linux == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --no-bin-links
      - run: node ./node_modules/electron-builder/out/cli/cli.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-linux
          path: dist/*

  release:
    needs: [build-windows, build-macos, build-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
            path: downloaded-artifacts
            merge-multiple: true

      - name: Generate timestamp tag
        id: meta
        run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "SDAppStore HTML Electron Runtime Release (${{ steps.meta.outputs.tag_name }})"
          files: downloaded-artifacts/*

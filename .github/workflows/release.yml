
name: Build Electron

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build for Windows
        type: boolean
        default: true
      linux:
        description: Build for Linux
        type: boolean
        default: true
      macos:
        description: Build for macOS
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
        run: |
          MATRIX='[]'

          if [ "$WINDOWS" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + ["windows"]')
          fi

          if [ "$LINUX" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + ["linux"]')
          fi

          if [ "$MACOS" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + ["macos"]')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: >-
      ${{
        matrix.platform == 'windows' && 'windows-latest' ||
        matrix.platform == 'linux' && 'ubuntu-latest' ||
        'macos-latest'
      }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx electron-builder

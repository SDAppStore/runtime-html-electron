<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple URL Navigator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 15px 0;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        .viewer-container {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
        }
    </style>
</head>
<body>

    <h1>Web Navigator</h1>
    
    <div class="controls">
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" value="https://example.com">
        <button onclick="navigateToUrl()">Go</button>
    </div>

    <div class="viewer-container" id="viewerContainer">
        <div class="placeholder" id="placeholderText">Enter a URL above to load it.</div>
    </div>

    <script>
        function navigateToUrl() {
            let url = document.getElementById('urlInput').value.trim();
            
            // Automatically prepend https:// if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                document.getElementById('urlInput').value = url;
            }

            const container = document.getElementById('viewerContainer');
            container.innerHTML = `<iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
        }

        // Trigger on pressing "Enter" key
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigateToUrl();
            }
        });
    </script>

</body>
</html>
